name: MCX option gap alerts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = check Upstox + Telegram; run = scan until the job time limit; once = single scan'
        type: choice
        options: [test, run, once]
        default: test
  schedule:
    # UTC cron. Three ~5.5h jobs cover the MCX session 09:00-23:55 IST (Mon-Fri):
    - cron: '27 3 * * 1-5'    # 08:57 IST -> ~14:25 IST
    - cron: '27 9 * * 1-5'    # 14:57 IST -> ~20:25 IST
    - cron: '27 14 * * 1-5'   # 19:57 IST -> ~23:57 IST
permissions:
  contents: write
concurrency:
  group: mcx-gap-state
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      STATE_DIR: ${{ github.workspace }}/.state
      CACHE_DIR: ${{ runner.temp }}/mcx-cache
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore persistent state branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mcx-gap-bot'
          git config user.email 'mcx-gap-bot@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin bot-state >/dev/null; then
            git fetch origin bot-state
            git worktree add -B bot-state .state origin/bot-state
          else
            git worktree add --detach .state HEAD
            git -C .state checkout --orphan bot-state
            git -C .state rm -rf .
            git -C .state clean -fd
          fi
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run scanner
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            test) python mcx_gap_scanner.py --test ;;
            once) python mcx_gap_scanner.py --once --ignore-hours ;;
            *)    python mcx_gap_scanner.py --max-minutes 330 ;;
          esac
      - name: Save state (open signals + signal log)
        if: always()
        shell: bash
        run: |
          cd .state
          if [ -f state.json ] || [ -f signals.csv ]; then
            git add state.json signals.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "state checkpoint [skip ci]"
            fi
            git push origin HEAD:bot-state
          fi
